name: Berita Saham ke Telegram

on:
  schedule:
    - cron: "*/15 * * * *"     # tiap 15 menit (GitHub kadang telat beberapa menit)
  workflow_dispatch:            # tombol "Run workflow" untuk jalan manual

permissions:
  contents: write               # untuk menyimpan terkirim.json (daftar berita yang sudah dikirim)

concurrency:
  group: berita-saham
  cancel-in-progress: false

jobs:
  kirim:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Ambil berita dan kirim ke Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # cari bot_berita_saham.py di mana pun letaknya di repository
          SKRIP=$(find . -name "bot_berita_saham.py" -not -path "./.git/*" | head -n 1)
          if [ -z "$SKRIP" ]; then
            echo "::error::File bot_berita_saham.py belum ada di repository. Upload dulu lewat Add file > Upload files."
            exit 1
          fi
          echo "Menjalankan $SKRIP"
          python3 "$SKRIP"
      - name: Simpan daftar berita yang sudah dikirim
        run: |
          git config user.name "bot-berita-saham"
          git config user.email "bot@users.noreply.github.com"
          git add -A -- ':(glob)**/terkirim.json'
          if git diff --cached --quiet; then
            echo "Tidak ada berita baru untuk dicatat."
          else
            git commit -m "update terkirim.json"
            git push
          fi
